<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | District After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1626; 
            --bg-secondary: #182238; 
            --text-primary: #CBA052; 
            --text-secondary: #DEBA84; 
            
            --accent: #8A2F25;
            --brand-red: #4C835C;
            
            --font-hero: 'Oswald', sans-serif;
            --font-main: 'EB Garamond', Georgia, serif;
            --font-header: 'EB Garamond', Georgia, serif;
            --font-subhead: 'EB Garamond', Georgia, serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding: 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(160deg, var(--brand-red) 0%, var(--accent) 55%, #0F1626 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .profile-container {
            background: var(--bg-primary);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text-primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .profile-header h2 {
            font-family: var(--font-header);
            font-size: 2.5rem;
            text-transform: uppercase;
        }
        
        .profile-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-btn {
            padding: 10px 20px;
            background: transparent;
            color: var(--brand-red);
            border: 2px solid var(--brand-red);
            border-radius: 5px;
            font-family: var(--font-main);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--brand-red);
            color: var(--bg-primary);
            box-shadow: 0 5px 15px rgba(195, 47, 0, 0.4);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(45, 27, 21, 0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .stat-card h3 {
            font-family: var(--font-header);
            text-transform: uppercase;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 3rem;
            font-family: var(--font-header);
            font-weight: 900;
            color: var(--brand-red);
        }
        
        .list-section {
            margin-bottom: 30px;
        }
        
        .list-section h3 {
            font-family: var(--font-header);
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--text-primary);
            padding-bottom: 5px;
        }
        
        .list-item {
            background: var(--bg-secondary);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .empty-msg {
            color: var(--text-secondary);
            font-style: italic;
        }

        .home-link {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="css/site-footer.css">
</head>
<body>

    <div class="profile-modal" id="profile-container" style="display: none;">
        <div class="profile-container">
            <a href="index.html" class="close-btn">&times;</a>
            <div class="profile-header-top">
                <button class="logout-btn" id="logout-btn">Log Out</button>
            </div>
            <div class="profile-header">
                <h2>Hi, <span id="user-name">Crawler</span></h2>
                <div id="district-badge" style="display: none; width: 40px; height: 40px; border-radius: 50%; background-color: var(--brand-red); color: var(--bg-primary); display: flex; align-items: center; justify-content: center; font-family: var(--font-header); font-weight: 900; font-size: 1.5rem; margin-left: 15px;"></div>
            </div>
            
            <div class="list-section" id="claim-district-section">
                <h3>Claim Your District</h3>
                <p style="margin-bottom: 15px; color: var(--text-secondary);">Select the district you represent to become a neighborhood hero!</p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="district-btn" data-district="A">A</button>
                    <button class="district-btn" data-district="B">B</button>
                    <button class="district-btn" data-district="C">C</button>
                    <button class="district-btn" data-district="D">D</button>
                    <button class="district-btn" data-district="E">E</button>
                </div>
            </div>
            
            <style>
                .district-btn {
                    width: 50px;
                    height: 50px;
                    border-radius: 50%;
                    border: 2px solid var(--text-primary);
                    background: transparent;
                    color: var(--text-primary);
                    font-family: var(--font-header);
                    font-weight: 900;
                    font-size: 1.5rem;
                    cursor: pointer;
                    transition: all 0.3s ease;
                }
                .district-btn:hover {
                    background: var(--brand-red);
                    color: var(--bg-primary);
                    border-color: var(--brand-red);
                    transform: scale(1.1);
                }
            </style>
            
            <div class="list-section">
                <h3>Your Activity</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h4 style="color: var(--text-secondary); margin-bottom: 10px; border-bottom: 1px solid rgba(203, 160, 82, 0.3); padding-bottom: 5px;">Votes by District</h4>
                        <div id="votes-list">
                            <!-- Dynamically populated -->
                        </div>
                    </div>
                    <div>
                        <h4 style="color: var(--text-secondary); margin-bottom: 10px; border-bottom: 1px solid rgba(203, 160, 82, 0.3); padding-bottom: 5px;">Check-ins by District</h4>
                        <div id="checkins-list">
                            <!-- Dynamically populated -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="stats-grid" style="display: none;">
                <div class="stat-card">
                    <h3>Total Points</h3>
                    <div class="stat-value" id="points-val">0</div>
                </div>
                <div class="stat-card">
                    <h3>Global Rank</h3>
                    <div class="stat-value" id="rank-val">-</div>
                </div>
            </div>
            
            <div id="notifications-section" class="list-section" style="display: none; background: rgba(138, 47, 37, 0.1); border-left: 4px solid var(--accent); padding: 15px;">
                <h3 style="color: var(--accent); margin-bottom: 10px;">Important Notices</h3>
                <div id="notifications-list" style="font-size: 0.95rem; color: #ffebcd;">
                    <!-- Dynamically populated -->
                </div>
            </div>
            
            <div class="list-section" style="display: none;">
                <h3>Your RSVPs</h3>
                <div id="rsvps-list">
                    <!-- Dynamically populated -->
                </div>
            </div>
            
            <div class="list-section" style="display: none;">
                <h3>Your Promo Codes</h3>
                <div id="promos-list">
                    <!-- Dynamically populated -->
                </div>
            </div>
            
            <a href="index.html" class="home-link" style="display: none;">← Back to Map</a>
        </div>
    </div>

    <!-- Module to fetch and display data -->
    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { doc, getDoc, setDoc, collection, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const profileContainer = document.getElementById("profile-container");
        const userNameEl = document.getElementById("user-name");
        const pointsVal = document.getElementById("points-val");
        const rankVal = document.getElementById("rank-val");
        const votesList = document.getElementById("votes-list");
        const checkinsList = document.getElementById("checkins-list");
        const rsvpsList = document.getElementById("rsvps-list");
        const logoutBtn = document.getElementById("logout-btn");
        const districtBadge = document.getElementById("district-badge");
        const claimDistrictSection = document.getElementById("claim-district-section");

        // Protect this page
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Not logged in, redirect to login
                window.location.href = "login.html";
            } else {
                // Logged in, show container and load data
                profileContainer.style.display = "flex";
                
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        
                        userNameEl.textContent = data.displayName || user.email.split('@')[0];
                        const points = data.totalPoints || 0;
                        pointsVal.textContent = points;
                        
                        try {
                            const higherScoreQuery = query(collection(db, "users"), where("totalPoints", ">", points));
                            const countSnapshot = await getCountFromServer(higherScoreQuery);
                            rankVal.textContent = "#" + (countSnapshot.data().count + 1);
                        } catch (e) {
                            console.error("Error fetching rank", e);
                        }
                        
                        // Hide these elements since they are now hidden in HTML
                        // const rsvps = data.rsvps || [];
                        // rsvpsVal.textContent = rsvps.length;
                        
                        // const promos = data.unlockedPromos || [];
                        // promosVal.textContent = promos.length;
                        
                        // const checkIns = data.checkIns || [];
                        // checkinsVal.textContent = checkIns.length;
                        
                        // Handle Claimed District
                        if (data.claimedDistrict) {
                            claimDistrictSection.style.display = 'none';
                            districtBadge.style.display = 'flex';
                            districtBadge.textContent = data.claimedDistrict;
                        } else {
                            const districtBtns = document.querySelectorAll('.district-btn');
                            districtBtns.forEach(btn => {
                                btn.addEventListener('click', async () => {
                                    const district = btn.getAttribute('data-district');
                                    try {
                                        await setDoc(userRef, { claimedDistrict: district }, { merge: true });
                                        claimDistrictSection.style.display = 'none';
                                        districtBadge.style.display = 'flex';
                                        districtBadge.textContent = district;
                                    } catch (e) {
                                        console.error("Error claiming district", e);
                                    }
                                });
                            });
                        }
                        
                        // Populate Votes
                        const votes = data.votes || {};
                        const voteIds = Object.keys(votes);
                        if (voteIds.length > 0) {
                            votesList.innerHTML = `<div class="empty-msg">Loading votes...</div>`;
                            const voteVenues = await Promise.all(voteIds.map(async (venueId) => {
                                try {
                                    const venueSnap = await getDoc(doc(db, "venues", venueId));
                                    if (venueSnap.exists()) {
                                        const vData = venueSnap.data();
                                        return { name: vData.name, district: vData.district || 'Unknown' };
                                    }
                                    return { name: venueId, district: 'Unknown' };
                                } catch (e) {
                                    return { name: venueId, district: 'Unknown' };
                                }
                            }));
                            
                            const votesByDistrict = {};
                            voteVenues.forEach(v => {
                                if (!votesByDistrict[v.district]) votesByDistrict[v.district] = [];
                                votesByDistrict[v.district].push(v.name);
                            });
                            
                            let votesHtml = '';
                            for (const [dist, venues] of Object.entries(votesByDistrict).sort()) {
                                votesHtml += `<div style="margin-bottom: 15px;">
                                    <strong style="color: var(--text-primary);">District ${dist}</strong>
                                    <ul style="list-style-type: none; padding-left: 10px; margin-top: 5px;">
                                        ${venues.map(v => `<li style="margin-bottom: 3px; color: var(--text-secondary);">&bull; ${v}</li>`).join('')}
                                    </ul>
                                </div>`;
                            }
                            votesList.innerHTML = votesHtml;
                        } else {
                            votesList.innerHTML = `<div class="empty-msg">You haven't voted for any venues yet.</div>`;
                        }
                        
                        // Populate Check-ins
                        const checkIns = data.checkIns || [];
                        if (checkIns.length > 0) {
                            checkinsList.innerHTML = `<div class="empty-msg">Loading check-ins...</div>`;
                            const checkinVenues = await Promise.all(checkIns.map(async (venueId) => {
                                try {
                                    const venueSnap = await getDoc(doc(db, "venues", venueId));
                                    if (venueSnap.exists()) {
                                        const vData = venueSnap.data();
                                        return { name: vData.name, district: vData.district || 'Unknown' };
                                    }
                                    return { name: venueId, district: 'Unknown' };
                                } catch (e) {
                                    return { name: venueId, district: 'Unknown' };
                                }
                            }));
                            
                            const checkinsByDistrict = {};
                            checkinVenues.forEach(v => {
                                if (!checkinsByDistrict[v.district]) checkinsByDistrict[v.district] = [];
                                checkinsByDistrict[v.district].push(v.name);
                            });
                            
                            let checkinsHtml = '';
                            for (const [dist, venues] of Object.entries(checkinsByDistrict).sort()) {
                                checkinsHtml += `<div style="margin-bottom: 15px;">
                                    <strong style="color: var(--text-primary);">District ${dist}</strong>
                                    <ul style="list-style-type: none; padding-left: 10px; margin-top: 5px;">
                                        ${venues.map(v => `<li style="margin-bottom: 3px; color: var(--text-secondary);">&bull; ${v}</li>`).join('')}
                                    </ul>
                                </div>`;
                            }
                            checkinsList.innerHTML = checkinsHtml;
                        } else {
                            checkinsList.innerHTML = `<div class="empty-msg">Scan a QR code at a participating venue to check in!</div>`;
                        }
                        
                    } else {
                        console.error("No user document found!");
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            }
        });

        // Logout
        logoutBtn.addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        });
    </script>
    <site-footer></site-footer>
    <script type="module" src="js/components/site-footer.js"></script>
    <script>
        // Use history.back() to go back to the previous page where the modal was opened from
        document.querySelector('.close-btn').addEventListener('click', function(e) {
            e.preventDefault();
            // Since this is a standalone page acting as a modal visually, 
            // the best way to return to the map/previous page is history.back()
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
