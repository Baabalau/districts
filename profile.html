<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | District After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1626; 
            --bg-secondary: #182238; 
            --text-primary: #CBA052; 
            --text-secondary: #DEBA84; 
            
            --accent: #8A2F25;
            --brand-red: #4C835C;
            
            --font-hero: 'Oswald', sans-serif;
            --font-main: 'EB Garamond', Georgia, serif;
            --font-header: 'EB Garamond', Georgia, serif;
            --font-subhead: 'EB Garamond', Georgia, serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
        }

        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(160deg, var(--brand-red) 0%, var(--accent) 55%, #0F1626 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 40px 20px;
        }

        .profile-container {
            background: var(--bg-primary);
            padding: 40px;
            padding-top: 90px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 820px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        /* --- Circular action buttons (match floating menu style) --- */
        .profile-icon-btn {
            position: absolute;
            top: 22px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(15, 22, 38, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: rgba(203, 160, 82, 0.85);
            border: 1px solid rgba(203, 160, 82, 0.4);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .profile-icon-btn svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .profile-icon-btn.text-btn {
            width: auto;
            padding: 0 20px;
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            border-radius: 30px;
        }

        .profile-icon-btn:hover {
            background: rgba(15, 22, 38, 0.72);
            color: #ffffff;
            transform: scale(1.06);
        }

        .profile-icon-btn:active { transform: scale(0.95); }

        #logout-btn {
            left: 22px;
            color: var(--brand-red);
            border-color: rgba(76, 131, 92, 0.6);
        }

        #logout-btn:hover {
            background: var(--brand-red);
            color: var(--bg-primary);
            border-color: var(--brand-red);
        }

        #close-btn { right: 22px; }

        /* --- Header --- */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            border-bottom: 2px solid var(--text-primary);
            padding-top: 10px;
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        .profile-identity h2 {
            font-family: var(--font-header);
            font-size: 2.5rem;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 0;
        }

        .profile-score-bottom {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(203, 160, 82, 0.3);
            text-align: center;
        }

        .score-block .score-value {
            font-family: var(--font-header);
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--brand-red);
            line-height: 1;
        }

        .score-block .score-label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* --- Sections --- */
        .list-section { margin-bottom: 30px; }

        .list-section h3 {
            font-family: var(--font-header);
            font-size: 1.5rem;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--text-primary);
            padding-bottom: 5px;
        }

        .section-hint {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .empty-msg {
            color: var(--text-secondary);
            font-style: italic;
        }

        /* --- District accordion cards --- */
        .district-card {
            background: var(--bg-secondary);
            border: 1px solid rgba(203, 160, 82, 0.18);
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .district-card.is-primary {
            border-color: rgba(76, 131, 92, 0.6);
            box-shadow: 0 0 0 1px rgba(76, 131, 92, 0.35);
        }

        .district-card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            font-family: var(--font-main);
            text-align: left;
        }

        .dc-left { display: flex; align-items: center; gap: 12px; }

        .dc-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--brand-red);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-header);
            font-weight: 900;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .dc-title {
            font-family: var(--font-header);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .dc-right { display: flex; align-items: center; gap: 14px; }

        .dc-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.2;
        }

        .dc-points {
            font-family: var(--font-header);
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--brand-red);
            white-space: nowrap;
        }

        .dc-points small {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .dc-rank {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .dc-chevron {
            transition: transform 0.25s ease;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .district-card.open .dc-chevron { transform: rotate(180deg); }

        .district-card-body {
            display: none;
            padding: 0 18px 18px;
            flex-direction: column;
            gap: 15px;
        }

        .district-card.open .district-card-body { display: flex; }

        .dc-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(203, 160, 82, 0.25);
            padding-bottom: 10px;
        }

        .dc-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-header);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 5px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dc-tab.active {
            background: rgba(203, 160, 82, 0.15);
            color: var(--text-primary);
            font-weight: 700;
        }

        .dc-tab-content { display: none; padding-top: 5px; }
        .dc-tab-content.active { display: block; }

        .dc-count {
            background: rgba(203, 160, 82, 0.15);
            color: var(--text-primary);
            border-radius: 20px;
            padding: 1px 9px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
        }

        .dc-tab-content ul { list-style: none; padding-left: 2px; }

        .dc-tab-content li {
            color: var(--text-secondary);
            margin-bottom: 4px;
            padding-left: 14px;
            position: relative;
        }

        .dc-tab-content li::before {
            content: '\2022';
            position: absolute;
            left: 0;
            color: var(--brand-red);
        }

        /* --- Claim controls --- */
        .claim-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .claim-pill {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--text-primary);
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-header);
            font-weight: 900;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .claim-pill:hover {
            transform: scale(1.08);
            border-color: var(--brand-red);
        }

        .claim-pill.claimed {
            background: var(--brand-red);
            border-color: var(--brand-red);
            color: var(--bg-primary);
        }

        .claim-pill.claimed::after {
            content: '\2713';
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-primary);
            color: var(--brand-red);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--brand-red);
        }

        @media (max-width: 640px) {
            .profile-container { padding: 30px 22px; padding-top: 84px; }
            .profile-identity h2 { font-size: 2rem; }
            .profile-header { align-items: flex-start; }
            .profile-score-bottom { gap: 18px; }
            .profile-icon-btn { width: 52px; height: 52px; }
        }
    </style>
    <link rel="stylesheet" href="css/site-footer.css">
</head>
<body>

    <div class="profile-modal" id="profile-container" style="display: none;">
        <div class="profile-container">
            <button class="profile-icon-btn text-btn" id="logout-btn" type="button" title="Log Out" aria-label="Log out">
                LOG OUT
            </button>
            <button class="profile-icon-btn" id="close-btn" type="button" title="Close" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>

            <div class="profile-header">
                <div class="profile-identity">
                    <h2>Hi, <span id="user-name">Crawler</span></h2>
                </div>
                <div class="list-section" style="margin-bottom: 0; width: 100%;">
                    <p class="section-hint" style="margin-bottom: 8px;">Your districts:</p>
                    <div class="claim-controls" id="claim-controls"></div>
                </div>
            </div>

            <div class="list-section">
                <h3>Your District(s)</h3>
                <p class="section-hint">Where you live & where you are in New Orleans. Track your votes and points gained from checking in at businesses.</p>
                <div id="claimed-districts"></div>
            </div>

            <div class="list-section">
                <h3>Other Districts</h3>
                <p class="section-hint">Every other district where you've checked in or voted.</p>
                <div id="other-districts"></div>
            </div>

            <div class="profile-score-bottom">
                <div class="score-block">
                    <span class="score-value" id="points-val">0</span>
                    <span class="score-label">Total Points</span>
                </div>
                <div class="score-block">
                    <span class="score-value" id="rank-val">—</span>
                    <span class="score-label">Global Rank</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Module to fetch and display data -->
    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { doc, getDoc, setDoc, collection, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const DISTRICTS = ['A', 'B', 'C', 'D', 'E'];
        const POINTS_PER_CHECKIN = 50;

        const profileContainer = document.getElementById("profile-container");
        const userNameEl = document.getElementById("user-name");
        const pointsVal = document.getElementById("points-val");
        const rankVal = document.getElementById("rank-val");
        const claimedContainer = document.getElementById("claimed-districts");
        const otherContainer = document.getElementById("other-districts");
        const claimControls = document.getElementById("claim-controls");
        const logoutBtn = document.getElementById("logout-btn");
        const closeBtn = document.getElementById("close-btn");

        let userRef = null;
        let claimedSet = new Set();
        let cachedByDistrict = {};
        let cachedUnknown = { checkins: [], votes: [] };

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Normalize a venue's stored district value down to a single letter A-E.
        function normalizeDistrict(raw) {
            if (!raw) return 'Unknown';
            const match = String(raw).toUpperCase().match(/[A-E]/);
            return match ? match[0] : 'Unknown';
        }

        function buildCard(district, dataObj, isPrimary, openByDefault) {
            const checkins = dataObj.checkins || [];
            const votes = dataObj.votes || [];
            const pts = checkins.length * POINTS_PER_CHECKIN;
            const label = district === 'Unknown' ? 'Other Venues' : 'District ' + district;
            const cardId = 'dc-' + Math.random().toString(36).substr(2, 9);

            const card = document.createElement('div');
            card.className = 'district-card' + (isPrimary ? ' is-primary' : '') + (openByDefault ? ' open' : '');
            card.innerHTML = `
                <button class="district-card-header" type="button" aria-expanded="${openByDefault ? 'true' : 'false'}">
                    <span class="dc-left">
                        ${isPrimary && district !== 'Unknown' ? `<span class="dc-badge">${district}</span>` : ''}
                        <span class="dc-title">${label}</span>
                    </span>
                    <span class="dc-right">
                        <span class="dc-stats">
                            <span class="dc-points">${pts} <small>pts</small></span>
                            <span class="dc-rank">Rank: #--</span>
                        </span>
                        <span class="dc-chevron">&#9662;</span>
                    </span>
                </button>
                <div class="district-card-body">
                    <div class="dc-tabs">
                        <button type="button" class="dc-tab active" data-target="checkins-${cardId}">Check-ins <span class="dc-count">${checkins.length}</span></button>
                        <button type="button" class="dc-tab" data-target="votes-${cardId}">Votes <span class="dc-count">${votes.length}</span></button>
                    </div>
                    <div class="dc-tab-content active" data-content="checkins-${cardId}">
                        ${checkins.length
                            ? `<ul>${checkins.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>`
                            : `<p class="empty-msg">No check-ins yet.</p>`}
                    </div>
                    <div class="dc-tab-content" data-content="votes-${cardId}">
                        ${votes.length
                            ? `<ul>${votes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>`
                            : `<p class="empty-msg">No votes yet.</p>`}
                    </div>
                </div>
            `;

            const header = card.querySelector('.district-card-header');
            header.addEventListener('click', () => {
                const isOpen = card.classList.toggle('open');
                header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            const tabs = card.querySelectorAll('.dc-tab');
            const contents = card.querySelectorAll('.dc-tab-content');
            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.stopPropagation();
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    card.querySelector(`.dc-tab-content[data-content="${tab.dataset.target}"]`).classList.add('active');
                });
            });

            return card;
        }

        function renderDistricts() {
            claimedContainer.innerHTML = '';
            otherContainer.innerHTML = '';

            const claimed = DISTRICTS.filter(d => claimedSet.has(d));
            const others = DISTRICTS.filter(d => !claimedSet.has(d));

            if (claimed.length === 0) {
                claimedContainer.innerHTML = `<p class="empty-msg">You haven't claimed a district yet. Claim one below to feature it here.</p>`;
            } else {
                claimed.forEach((d, i) => {
                    claimedContainer.appendChild(buildCard(d, cachedByDistrict[d], true, i === 0));
                });
            }

            others.forEach(d => {
                otherContainer.appendChild(buildCard(d, cachedByDistrict[d], false, false));
            });

            if (cachedUnknown.checkins.length || cachedUnknown.votes.length) {
                otherContainer.appendChild(buildCard('Unknown', cachedUnknown, false, false));
            }
        }

        function renderClaimControls() {
            claimControls.innerHTML = DISTRICTS.map(d =>
                `<button type="button" class="claim-pill ${claimedSet.has(d) ? 'claimed' : ''}" data-district="${d}" aria-pressed="${claimedSet.has(d)}">${d}</button>`
            ).join('');

            claimControls.querySelectorAll('.claim-pill').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const d = btn.getAttribute('data-district');
                    if (claimedSet.has(d)) {
                        claimedSet.delete(d);
                    } else {
                        claimedSet.add(d);
                    }
                    try {
                        if (userRef) {
                            await setDoc(userRef, { claimedDistricts: Array.from(claimedSet) }, { merge: true });
                        }
                    } catch (e) {
                        console.error("Error updating claimed districts", e);
                    }
                    renderClaimControls();
                    renderDistricts();
                });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html?redirect=profile.html";
                return;
            }

            profileContainer.style.display = "flex";

            try {
                userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    console.error("No user document found!");
                    return;
                }

                const data = userSnap.data();

                userNameEl.textContent = data.displayName || user.email.split('@')[0];

                const points = data.totalPoints || 0;
                pointsVal.textContent = points;

                try {
                    const higherScoreQuery = query(collection(db, "users"), where("totalPoints", ">", points));
                    const countSnapshot = await getCountFromServer(higherScoreQuery);
                    rankVal.textContent = "#" + (countSnapshot.data().count + 1);
                } catch (e) {
                    console.error("Error fetching rank", e);
                    rankVal.textContent = "—";
                }

                // Support multiple claimed districts; migrate legacy single value.
                claimedSet = new Set(
                    Array.isArray(data.claimedDistricts)
                        ? data.claimedDistricts
                        : (data.claimedDistrict ? [data.claimedDistrict] : [])
                );

                // Gather venue details for every vote + check-in.
                const votes = data.votes || {};
                const voteIds = Object.keys(votes);
                const checkInIds = data.checkIns || [];
                const allIds = [...new Set([...voteIds, ...checkInIds])];

                const venueMap = {};
                await Promise.all(allIds.map(async (venueId) => {
                    try {
                        const venueSnap = await getDoc(doc(db, "venues", venueId));
                        if (venueSnap.exists()) {
                            const vData = venueSnap.data();
                            venueMap[venueId] = {
                                name: vData.name || venueId,
                                district: normalizeDistrict(vData.district)
                            };
                        } else {
                            venueMap[venueId] = { name: venueId, district: 'Unknown' };
                        }
                    } catch (e) {
                        venueMap[venueId] = { name: venueId, district: 'Unknown' };
                    }
                }));

                // Build the per-district activity structure (all five always present).
                cachedByDistrict = {};
                DISTRICTS.forEach(d => { cachedByDistrict[d] = { checkins: [], votes: [] }; });
                cachedUnknown = { checkins: [], votes: [] };

                checkInIds.forEach(id => {
                    const v = venueMap[id] || { name: id, district: 'Unknown' };
                    (cachedByDistrict[v.district] || cachedUnknown).checkins.push(v.name);
                });
                voteIds.forEach(id => {
                    const v = venueMap[id] || { name: id, district: 'Unknown' };
                    (cachedByDistrict[v.district] || cachedUnknown).votes.push(v.name);
                });

                renderDistricts();
                renderClaimControls();

            } catch (error) {
                console.error("Error fetching user data:", error);
            }
        });

        // Logout
        logoutBtn.addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        });

        // Close -> return to the page the user came from (never an auth page).
        closeBtn.addEventListener("click", () => {
            const ref = document.referrer;
            if (ref) {
                try {
                    const u = new URL(ref);
                    if (u.origin === window.location.origin
                        && !u.pathname.endsWith('login.html')
                        && !u.pathname.endsWith('profile.html')) {
                        window.location.href = ref;
                        return;
                    }
                } catch (e) { /* fall through */ }
            }
            window.location.href = 'index.html';
        });
    </script>
    <site-footer></site-footer>
    <script type="module" src="js/components/site-footer.js"></script>
</body>
</html>
