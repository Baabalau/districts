<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | District After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1626; 
            --text-primary: #CBA052; 
            --text-secondary: #DEBA84;
            --accent: #8A2F25;
            --brand-red: #4C835C;
            --font-hero: 'Oswald', sans-serif;
            --font-main: 'EB Garamond', Georgia, serif;
            --font-header: 'EB Garamond', Georgia, serif;
            --font-subhead: 'EB Garamond', Georgia, serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .auth-container {
            background: var(--bg-primary);
            padding: 40px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .auth-container h2 {
            font-family: var(--font-header);
            font-size: 2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .auth-container p.instructions {
            margin-bottom: 25px;
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-family: var(--font-main);
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(222, 186, 132, 0.55);
        }

        .input-group input:focus {
            border-color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(180deg, var(--accent) 0%, var(--brand-red) 100%);
            color: var(--bg-primary);
            border: none;
            border-radius: 5px;
            font-family: var(--font-main);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(195, 47, 0, 0.4);
        }

        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .google-btn {
            background: var(--text-primary);
            margin-top: 15px;
        }

        .google-btn:hover {
            background: #e0bc6a;
            box-shadow: 0 5px 15px rgba(203, 160, 82, 0.35);
        }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-secondary);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
        }
        .divider span {
            padding: 0 10px;
            font-size: 0.9rem;
            font-weight: bold;
            font-style: italic;
            color: var(--text-secondary);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }
        
        .error-msg {
            color: #e07a6f;
            font-size: 1rem;
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: bold;
        }

        .success-msg {
            color: #7fd99a;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="auth-title">Log In / Sign Up</h2>
        <p class="instructions" id="auth-instructions">Enter your email to receive a secure login link, or sign in with Google.</p>
        <div id="error-message" class="error-msg"></div>
        <div id="success-message" class="success-msg"></div>
        
        <div id="auth-form-container">
            <form id="auth-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <button type="submit" class="auth-btn" id="submit-btn">Send Magic Link</button>
            </form>
            
            <div class="divider"><span>OR</span></div>

            <button class="auth-btn google-btn" id="google-btn">Sign in with Google</button>
        </div>
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <!-- Need to load Firebase scripts as modules to use the setup -->
    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { 
            GoogleAuthProvider,
            signInWithPopup,
            sendSignInLinkToEmail,
            isSignInWithEmailLink,
            signInWithEmailLink
        } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const form = document.getElementById("auth-form");
        const emailInput = document.getElementById("email");
        const submitBtn = document.getElementById("submit-btn");
        const googleBtn = document.getElementById("google-btn");
        const errorMsg = document.getElementById("error-message");
        const successMsg = document.getElementById("success-message");
        const authFormContainer = document.getElementById("auth-form-container");
        const authInstructions = document.getElementById("auth-instructions");

        // Ensure user document exists (used after auth completes)
        async function ensureUserDocument(user) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || user.email.split('@')[0],
                    totalPoints: 0,
                    rsvps: [],
                    unlockedPromos: []
                });
            }
        }

        // Handle Magic Link Form Submission
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.textContent = "";
            successMsg.textContent = "";
            const email = emailInput.value;

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";

            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect') || 'profile.html';

            const actionCodeSettings = {
                // URL you want to redirect back to. The domain must be in the authorized domains list in the Firebase Console.
                url: window.location.origin + window.location.pathname + '?redirect=' + encodeURIComponent(redirectUrl),
                handleCodeInApp: true,
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                // Save the email locally so you don't need to ask the user for it again
                // if they open the link on the same device.
                window.localStorage.setItem('emailForSignIn', email);
                
                authFormContainer.style.display = "none";
                authInstructions.style.display = "none";
                successMsg.textContent = `A login link has been sent to ${email}. Please check your inbox and click the link to continue.`;
            } catch (error) {
                console.error(error);
                errorMsg.textContent = error.message.replace("Firebase: ", "");
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Magic Link";
            }
        });

        // Handle Google Sign In
        googleBtn.addEventListener("click", async () => {
            errorMsg.textContent = "";
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                await ensureUserDocument(result.user);
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUrl = urlParams.get('redirect') || 'profile.html';
                window.location.href = redirectUrl;
            } catch (error) {
                errorMsg.textContent = error.message.replace("Firebase: ", "");
            }
        });

        // Check if returning from a magic link
        async function handleEmailLinkSignIn() {
            if (isSignInWithEmailLink(auth, window.location.href)) {
                authFormContainer.style.display = "none";
                authInstructions.textContent = "Authenticating...";
                
                let email = window.localStorage.getItem('emailForSignIn');
                if (!email) {
                    // User opened the link on a different device. To prevent session fixation
                    // attacks, ask the user to provide the associated email again.
                    email = window.prompt('Please provide your email for confirmation');
                }
                
                if (email) {
                    try {
                        const result = await signInWithEmailLink(auth, email, window.location.href);
                        window.localStorage.removeItem('emailForSignIn');
                        await ensureUserDocument(result.user);
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect') || 'profile.html';
                        window.location.href = redirectUrl;
                    } catch (error) {
                        console.error(error);
                        errorMsg.textContent = "Error signing in with link. The link may have expired or already been used.";
                        authFormContainer.style.display = "block";
                        authInstructions.textContent = "Enter your email to receive a secure login link, or sign in with Google.";
                    }
                } else {
                    authFormContainer.style.display = "block";
                    authInstructions.textContent = "Enter your email to receive a secure login link, or sign in with Google.";
                }
            }
        }

        // Run on page load
        handleEmailLinkSignIn();

        // Check if user is already logged in, redirect them (unless they are currently processing a sign in link)
        auth.onAuthStateChanged((user) => {
            if (user && !isSignInWithEmailLink(auth, window.location.href)) {
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUrl = urlParams.get('redirect') || 'profile.html';
                window.location.href = redirectUrl;
            }
        });
    </script>
</body>
</html>
