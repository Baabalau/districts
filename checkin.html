<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In | District After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1626; 
            --text-primary: #CBA052; 
            --text-secondary: #DEBA84; 
            --accent: #8A2F25;
            --brand-red: #4C835C;
            --font-main: 'EB Garamond', Georgia, serif;
            --font-header: 'Oswald', sans-serif;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        site-footer {
            width: 100%;
            margin-top: auto;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(203, 160, 82, 0.3);
        }
        h1 {
            font-family: var(--font-header);
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .status {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--text-secondary);
        }
        .points-award {
            font-size: 3rem;
            font-family: var(--font-header);
            color: var(--brand-red);
            font-weight: bold;
            margin: 20px 0;
            display: none;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(180deg, var(--accent) 0%, var(--brand-red) 100%);
            color: var(--bg-primary);
            text-decoration: none;
            font-family: var(--font-main);
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
    <link rel="stylesheet" href="css/site-footer.css">
</head>
<body>
    <div class="container">
        <h1>Nightcrawl Check-In</h1>
        <div class="status" id="status-msg">Verifying venue...</div>
        <div id="photo-verification" style="display: none; margin-bottom: 20px;">
            <p style="margin-bottom: 15px;">Please snap a quick photo to verify your visit!</p>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
            <button class="btn" id="open-camera-btn" style="display: inline-block; width: 100%; margin-top: 0;">📸 Open Camera</button>
            <div id="upload-status" style="margin-top: 15px; font-size: 0.95rem; color: var(--text-secondary); text-align: left; display: none; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                <div id="step-compress" style="margin-bottom: 8px;">⚪ Compressing photo...</div>
                <div id="step-upload" style="margin-bottom: 8px;">⚪ Uploading securely...</div>
                <div id="step-finalize">⚪ Finalizing check-in...</div>
                
                <div id="fallback-options" style="display: none; margin-top: 15px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <p style="color: #ff6b6b; margin-top: 0; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem;">Upload Interrupted</p>
                    <button class="btn" id="retry-upload-btn" style="padding: 8px 16px; font-size: 0.85rem; margin: 0 5px; display: inline-block;">Try Again</button>
                    <button class="btn" id="skip-upload-btn" style="padding: 8px 16px; font-size: 0.85rem; background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary); margin: 0 5px; display: inline-block;">Upload Later</button>
                </div>
            </div>
            <!-- Canvas to compress image before upload -->
            <canvas id="compress-canvas" style="display: none;"></canvas>
        </div>
        <div class="points-award" id="points-award">+50 Points!</div>
        <a href="profile.html" class="btn" id="profile-btn">View My Profile</a>
        <a href="index.html" class="btn" id="home-btn" style="background: var(--text-primary);">Back to Map</a>
    </div>

    <script type="module">
        import { auth, db, storage } from "./js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, getDoc, updateDoc, setDoc, arrayUnion, increment, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js";

        const statusMsg = document.getElementById("status-msg");
        const pointsAward = document.getElementById("points-award");
        const profileBtn = document.getElementById("profile-btn");
        const homeBtn = document.getElementById("home-btn");
        
        const photoVerification = document.getElementById("photo-verification");
        const cameraInput = document.getElementById("camera-input");
        const openCameraBtn = document.getElementById("open-camera-btn");
        const uploadStatus = document.getElementById("upload-status");
        const stepCompress = document.getElementById("step-compress");
        const stepUpload = document.getElementById("step-upload");
        const stepFinalize = document.getElementById("step-finalize");
        const fallbackOptions = document.getElementById("fallback-options");
        const retryUploadBtn = document.getElementById("retry-upload-btn");
        const skipUploadBtn = document.getElementById("skip-upload-btn");
        const compressCanvas = document.getElementById("compress-canvas");
        
        function resetSteps() {
            uploadStatus.style.display = "block";
            stepCompress.innerHTML = "⚪ Compressing photo..."; stepCompress.style.color = "var(--text-secondary)";
            stepUpload.innerHTML = "⚪ Uploading securely..."; stepUpload.style.color = "var(--text-secondary)";
            stepFinalize.innerHTML = "⚪ Finalizing check-in..."; stepFinalize.style.color = "var(--text-secondary)";
            fallbackOptions.style.display = "none";
        }

        const urlParams = new URLSearchParams(window.location.search);
        const venueQrCode = urlParams.get('venue');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Redirect to login with redirect param
                const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
                window.location.href = `login.html?redirect=${currentUrl}`;
                return;
            }

            if (!venueQrCode) {
                statusMsg.textContent = "Invalid Check-In Link. No venue specified.";
                homeBtn.style.display = "inline-block";
                return;
            }

            try {
                // Find the venue by its document ID (venueQrCode)
                const venueRef = doc(db, "venues", venueQrCode);
                const venueSnap = await getDoc(venueRef);

                if (!venueSnap.exists()) {
                    statusMsg.textContent = "Venue not found! Invalid QR code.";
                    homeBtn.style.display = "inline-block";
                    return;
                }

                const venueData = venueSnap.data();
                const venueName = venueData.name || "this venue";
                const venueId = venueSnap.id;

                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const userData = userSnap.exists() ? userSnap.data() : { displayName: "Crawler", email: user.email };

                // 24-HOUR COOLDOWN CHECK
                const customerRef = doc(db, "venues", venueId, "customers", user.uid);
                const customerSnap = await getDoc(customerRef);
                
                let isFirstVisit = true;
                let visitCount = 0;

                if (customerSnap.exists()) {
                    isFirstVisit = false;
                    const custData = customerSnap.data();
                    visitCount = custData.visitCount || 0;
                    
                    if (custData.lastVisit) {
                        const lastVisitDate = custData.lastVisit.toDate();
                        const now = new Date();
                        const hoursSince = Math.abs(now - lastVisitDate) / 36e5;
                        
                        if (hoursSince < 24) {
                            statusMsg.textContent = `You've already checked into ${venueName} recently. Try again in ${Math.ceil(24 - hoursSince)} hours!`;
                            profileBtn.style.display = "inline-block";
                            homeBtn.style.display = "inline-block";
                            return;
                        }
                    }
                }

                // If they passed the cooldown, require a photo
                statusMsg.textContent = `Checking into ${venueName}`;
                photoVerification.style.display = "block";
                
                openCameraBtn.addEventListener("click", () => {
                    cameraInput.click();
                });
                
                cameraInput.addEventListener("change", async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    openCameraBtn.style.display = "none";
                    resetSteps();
                    stepCompress.innerHTML = "⏳ Compressing photo...";
                    stepCompress.style.color = "var(--text-primary)";
                    
                    // Compress image using Canvas
                    const reader = new FileReader();
                    reader.onload = (readerEvent) => {
                        const img = new Image();
                        img.onload = async () => {
                            const MAX_WIDTH = 800;
                            const MAX_HEIGHT = 800;
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }
                            
                            compressCanvas.width = width;
                            compressCanvas.height = height;
                            const ctx = compressCanvas.getContext("2d");
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // Convert to highly compressed JPEG blob
                            compressCanvas.toBlob(async (blob) => {
                                if (!blob) {
                                    stepCompress.innerHTML = "❌ Compression failed"; 
                                    stepCompress.style.color = "#ff6b6b";
                                    fallbackOptions.style.display = "block";
                                    return;
                                }
                                
                                stepCompress.innerHTML = "✅ Photo compressed"; 
                                stepCompress.style.color = "var(--brand-red)";
                                stepUpload.innerHTML = "⏳ Uploading securely..."; 
                                stepUpload.style.color = "var(--text-primary)";

                                try {
                                    // Upload to Firebase Storage
                                    const fileName = `checkins/${venueId}/${user.uid}_${Date.now()}.jpg`;
                                    const storageRef = ref(storage, fileName);
                                    
                                    // Use uploadBytes instead of uploadString (more reliable on mobile/Safari)
                                    await uploadBytes(storageRef, blob);
                                    const downloadURL = await getDownloadURL(storageRef);
                                    
                                    stepUpload.innerHTML = "✅ Upload complete"; 
                                    stepUpload.style.color = "var(--brand-red)";
                                    stepFinalize.innerHTML = "⏳ Finalizing check-in..."; 
                                    stepFinalize.style.color = "var(--text-primary)";
                                    
                                    try {
                                        // Finalize Firestore Data
                                        await finalizeCheckIn(venueId, venueName, user, userData, isFirstVisit, visitCount, downloadURL);
                                        
                                        stepFinalize.innerHTML = "✅ Check-in complete!"; 
                                        stepFinalize.style.color = "var(--brand-red)";
                                    } catch (firestoreError) {
                                        console.error("Firestore finalize failed", firestoreError);
                                        const errMsg = firestoreError.message ? firestoreError.message : firestoreError;
                                        stepFinalize.innerHTML = `❌ Database error <span style="display:block; font-size: 0.8rem; margin-top:4px; opacity:0.8;">(${errMsg})</span>`; 
                                        stepFinalize.style.color = "#ff6b6b";
                                    }
                                    
                                } catch (uploadError) {
                                    console.error("Upload failed", uploadError);
                                    const errMsg = uploadError.message ? uploadError.message : uploadError;
                                    stepUpload.innerHTML = `❌ Upload failed <span style="display:block; font-size: 0.8rem; margin-top:4px; opacity:0.8;">(${errMsg})</span>`; 
                                    stepUpload.style.color = "#ff6b6b";
                                    fallbackOptions.style.display = "block";
                                }
                            }, "image/jpeg", 0.6);
                        };
                        img.src = readerEvent.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                retryUploadBtn.addEventListener("click", () => {
                    cameraInput.click();
                });

                skipUploadBtn.addEventListener("click", async () => {
                    fallbackOptions.style.display = "none";
                    stepFinalize.innerHTML = "⏳ Finalizing without photo..."; 
                    stepFinalize.style.color = "var(--text-primary)";
                    
                    try {
                        await finalizeCheckIn(venueId, venueName, user, userData, isFirstVisit, visitCount, "pending_upload");
                        stepFinalize.innerHTML = "✅ Check-in logged!"; 
                        stepFinalize.style.color = "var(--brand-red)";
                    } catch (err) {
                        console.error("Finalize error", err);
                        stepFinalize.innerHTML = `❌ Finalization failed <span style="display:block; font-size: 0.8rem; margin-top:4px; opacity:0.8;">(${err.message || err})</span>`; 
                        stepFinalize.style.color = "#ff6b6b";
                    }
                });

                async function finalizeCheckIn(venueId, venueName, user, userData, isFirstVisit, visitCount, imageUrl) {
                    // 1. Update Venue -> Customer loyalty document
                    const customerRef = doc(db, "venues", venueId, "customers", user.uid);
                    const newVisitCount = visitCount + 1;
                    
                    const photoData = imageUrl === "pending_upload" 
                        ? { photoStatus: "pending" } 
                        : { photoStatus: "uploaded", photoUrl: imageUrl };
                        
                    await setDoc(customerRef, {
                        displayName: userData.displayName || "Crawler",
                        email: user.email,
                        visitCount: newVisitCount,
                        lastVisit: serverTimestamp(),
                        ...photoData
                    }, { merge: true });

                    // 2. Local Legend (Global) points logic - ONLY ON FIRST VISIT
                    if (isFirstVisit) {
                        const userRef = doc(db, "users", user.uid);
                        // setDoc(merge) rather than updateDoc: a first-time sign-in can land
                        // straight on this page before auth.js has created the profile doc,
                        // and updateDoc throws not-found in that race — silently dropping the
                        // +50 (the customer doc is already written, so the check-in "sticks"
                        // with zero points). Merging creates the doc if missing; including uid
                        // satisfies the users create rule.
                        await setDoc(userRef, {
                            uid: user.uid,
                            email: user.email,
                            displayName: userData.displayName || "Crawler",
                            checkIns: arrayUnion(venueId),
                            totalPoints: increment(50)
                        }, { merge: true });
                        pointsAward.style.display = "block";
                        pointsAward.textContent = "+50 Points!";
                    } else {
                        pointsAward.style.display = "block";
                        pointsAward.textContent = "Loyalty Visit Logged!";
                        pointsAward.style.color = "var(--text-primary)";
                    }

                    photoVerification.style.display = "none";
                    statusMsg.innerHTML = `Success! You supported <strong style="color:var(--text-primary)">${venueName}</strong>.`;
                    
                    profileBtn.style.display = "inline-block";
                    homeBtn.style.display = "inline-block";
                    
                    // 3. Webhook Integration for Notion
                    // REPLACE THIS URL with your actual Zapier / Make.com webhook URL
                    const WEBHOOK_URL = "https://hook.us1.make.com/YOUR_WEBHOOK_ID_HERE"; 
                    
                    if (WEBHOOK_URL.includes("YOUR_WEBHOOK_ID_HERE")) {
                        console.log("Webhook skipped: Please replace WEBHOOK_URL in checkin.html with your actual Zapier/Make URL.");
                    } else {
                        try {
                            fetch(WEBHOOK_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    venueName: venueName,
                                    venueId: venueId,
                                    patronName: userData.displayName || "Crawler",
                                    email: user.email,
                                    visitCount: newVisitCount,
                                    photoUrl: imageUrl === "pending_upload" ? "Pending Upload" : imageUrl,
                                    timestamp: new Date().toISOString()
                                })
                            }).catch(e => console.error("Webhook trigger failed (non-critical):", e));
                        } catch (e) {
                            // Non-critical, ignore
                        }
                    }
                }

            } catch (error) {
                console.error("Check-in error:", error);
                statusMsg.textContent = "An error occurred during check-in.";
            }
        });
    </script>
    <site-footer></site-footer>
    <script type="module" src="js/components/site-footer.js"></script>
</body>
</html>
