<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District D Crawl | District After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="css/district-page.css">
    <link rel="stylesheet" href="css/event-styles.css">
    <link rel="stylesheet" href="css/site-footer.css">
    <script type="module" src="js/event-components.js?v=5"></script>
</head>
<body>
    <nav>
        <div class="logo">District <span>After Dark</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#events">Events</a>
            <a href="login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>

    <event-layout district="D"></event-layout>

    <footer class="site-footer site-footer--event" role="contentinfo">
        <div class="site-footer-inner">
            <p class="site-footer-label">City partners</p>
            <ul class="site-footer-links">
                <li><a href="https://nola.gov/night" target="_blank" rel="noopener noreferrer">Mayor’s Office of Nighttime Economy</a></li>
                <li><a href="https://council.nola.gov/" target="_blank" rel="noopener noreferrer">New Orleans City Council</a></li>
            </ul>
        </div>
    </footer>

    <script>
        function upvote(btn, count) {
            btn.innerHTML = `▲ <span>${count + 1}</span>`;
            btn.style.background = 'var(--accent)';
            btn.style.color = 'var(--text-primary)';
            btn.onclick = null;
        }
    </script>
    <script src="council_districts.js"></script>
    <script type="module" src="js/district-map.js?v=3"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
