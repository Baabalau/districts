<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Reveal Layers | Districts After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-primary: #0F1626;
            --text-primary: #CBA052;
            --text-secondary: #DEBA84;
        }
        body {
            margin: 0;
            font-family: 'EB Garamond', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 24px;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            margin: 0;
            font-size: 1.4rem;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, select {
            font-family: 'EB Garamond', Georgia, serif;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid rgba(203, 160, 82, 0.4);
            background: rgba(203, 160, 82, 0.12);
            color: var(--text-primary);
            cursor: pointer;
        }
        button:hover { background: rgba(203, 160, 82, 0.22); }
        #status { color: var(--text-secondary); margin-bottom: 16px; min-height: 1.4em; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .layer-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(203, 160, 82, 0.2);
            border-radius: 10px;
            padding: 12px;
        }
        .layer-card h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin: 0 0 10px;
            letter-spacing: 0.5px;
        }
        .preview {
            background:
                linear-gradient(45deg, rgba(255,255,255,0.08) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.08) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.08) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.08) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            border-radius: 8px;
            padding: 12px;
            overflow: auto;
            min-height: 80px;
        }
        .layer-actions { margin-top: 10px; }
        .layer-actions button { width: 100%; font-size: 0.95rem; }

        /* Export styles copied from event reveal cards */
        .export-styles .stop-label-3d {
            display: inline-block;
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #CBA052;
            text-transform: uppercase;
            transform: rotate(-2deg) skewX(-5deg);
            text-shadow:
                1px 1px 0px #0F1626,
                2px 2px 0px #8A2F25,
                3px 3px 0px #8A2F25,
                4px 4px 0px #4C835C,
                5px 5px 8px rgba(0,0,0,0.4);
            letter-spacing: 1px;
            margin: 0;
        }
        .export-styles .stop-avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            box-sizing: border-box;
            border: 3px solid transparent;
            background: conic-gradient(from -45deg, #CBA052, #8A2F25, #4C835C, #CBA052) border-box;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #8A2F25;
            flex-shrink: 0;
        }
        .export-styles .winner-card-crown {
            font-size: 2.8rem;
            background:
                linear-gradient(#182238, #182238) padding-box,
                conic-gradient(from -45deg, #CBA052, #8A2F25, #4C835C, #CBA052) border-box;
        }
        .export-styles .stop-title {
            margin: 0;
            font-size: 1.7rem;
            line-height: 1.2;
            font-family: 'EB Garamond', Georgia, serif;
            text-transform: uppercase;
            color: #CBA052;
        }
        .export-styles .reveal-business-name {
            margin: 0;
            padding: 6px 10px;
            font-size: 2.2rem;
            font-family: 'Oswald', sans-serif;
            color: #8A2F25;
            text-transform: uppercase;
            text-align: left;
            background: #CBA052;
            border-radius: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            width: fit-content;
            line-height: 1.1;
            display: inline-block;
        }
        .export-styles .reveal-card-media {
            display: block;
            width: 430px;
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .export-styles .winner-photo { width: 780px; max-width: 100%; height: 250px; }
        .export-styles .reveal-body,
        .export-styles .winner-summary {
            margin: 0;
            max-width: 430px;
            font-size: 1.375rem;
            line-height: 32px;
            color: #DEBA84;
        }
        .export-styles .winner-summary { max-width: 780px; }
        .export-styles .reveal-card-footer {
            max-width: 430px;
            padding-top: 14px;
            border-top: 1px solid rgba(203, 160, 82, 0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .export-styles .reveal-business-address,
        .export-styles .stop-host-link {
            font-size: 1.375rem;
            color: #DEBA84;
            text-decoration: none;
        }
        .export-styles .stop-host-link { color: #4C835C; font-weight: 600; }
        .export-styles .proc-card {
            background: linear-gradient(165deg, rgba(15, 22, 38, 0.95) 0%, rgba(15, 22, 38, 0.8) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .export-styles .runoff-frame { width: 500px; max-width: 100%; height: 520px; padding: 35px; }
        .export-styles .winner-frame {
            width: 850px;
            max-width: 100%;
            height: 760px;
            padding: 28px 35px 35px;
            border: 2px solid #CBA052;
            box-shadow: 0 0 45px rgba(203, 160, 82, 0.85);
        }
        .export-styles .hero-meetup-highlight {
            display: inline-block;
            background: #8A2F25;
            color: #fff;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 1.375rem;
        }
        .export-styles .winner-card-host {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .export-styles .winner-card-host-role {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #DEBA84;
        }
        .export-styles .winner-card-host-name {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: #CBA052;
        }
        .export-root { display: inline-block; background: transparent; }
    </style>
</head>
<body>
    <header>
        <h1>Reveal Layer Exporter</h1>
        <div class="controls">
            <select id="district-select">
                <option value="c">District C</option>
                <option value="e">District E</option>
                <option value="a">District A</option>
                <option value="b">District B</option>
                <option value="d">District D</option>
            </select>
            <button id="export-all-btn" type="button">Download All as ZIP</button>
            <button id="save-folder-btn" type="button">Save to Folder…</button>
        </div>
    </header>
    <p id="status">Loading district data…</p>
    <div id="layer-grid" class="grid export-styles"></div>

    <script type="module">
        const params = new URLSearchParams(window.location.search);
        const districtSelect = document.getElementById('district-select');
        districtSelect.value = (params.get('district') || 'c').toLowerCase();

        function interpolate(text, vars) {
            if (!text) return '';
            return text.replace(/\{(\w+)\}/g, (_, key) => vars[key] ?? `{${key}}`);
        }

        function formatStreetAddress(address) {
            if (!address || typeof address !== 'string') return '';
            const trimmed = address.trim();
            const commaIdx = trimmed.indexOf(',');
            return commaIdx === -1 ? trimmed : trimmed.slice(0, commaIdx).trim();
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function getStopHostRole(stop, index) {
            return stop.hostRole ?? (index === 0 ? 'influencer' : 'council');
        }

        function socialHandleFromUrl(url) {
            try {
                const segment = new URL(url).pathname.replace(/\/+$/, '').split('/').pop();
                return segment ? `@${segment}` : 'Profile';
            } catch {
                return 'Profile';
            }
        }

        function buildVars(districtCopy) {
            const councilFirstName = districtCopy.councilName?.split(' ')[0] ?? '';
            const influencerFirstName = districtCopy.influencerName?.split(' ')[0] ?? '';
            const brandedAccounts = ['EatenPathNola', 'EmpowerYouNola'];
            const influencerIntro = brandedAccounts.includes(districtCopy.influencerAccountTitle)
                ? `${districtCopy.influencerName} of ${districtCopy.influencerAccountTitle}`
                : districtCopy.influencerName;

            return {
                district: districtCopy.district,
                date: districtCopy.date,
                councilName: districtCopy.councilName,
                councilDisplayName: districtCopy.councilDisplayName || districtCopy.councilName,
                councilFirstName,
                influencerName: districtCopy.influencerName,
                influencerFirstName,
                influencerIntro,
                influencerAccountTitle: districtCopy.influencerAccountTitle ?? '',
                influencerRole: districtCopy.influencerAccountTitle || 'The Tastemaker'
            };
        }

        function buildRunoffLayers(prefix, stop, vars, host) {
            const title = interpolate(stop.title, vars);
            const body = interpolate(stop.runoffBody || stop.body, vars);
            const address = formatStreetAddress(stop.address);
            const websiteText = stop.businessName ? `${stop.businessName} on the web` : 'Visit Website';
            const stopLabel = stop.number === '01' ? 'FIRST STOP' : 'SECOND STOP';

            return [
                { file: `${prefix}-frame.png`, label: `${prefix} frame`, html: `<div class="proc-card runoff-frame"></div>` },
                { file: `${prefix}-stop-label-3d.png`, label: `${prefix} 3D stop label`, html: `<div class="stop-label-3d">${stopLabel}</div>` },
                { file: `${prefix}-avatar.png`, label: `${prefix} avatar`, html: `<img src="${host.img}" class="stop-avatar" alt="">` },
                { file: `${prefix}-stop-title.png`, label: `${prefix} stop title`, html: `<h3 class="stop-title">${escapeHtml(title)}</h3>` },
                { file: `${prefix}-business-photo.png`, label: `${prefix} business photo`, html: stop.image ? `<img src="${stop.image}" class="reveal-card-media" alt="">` : `<div class="reveal-card-media" style="background:rgba(255,255,255,0.08);"></div>` },
                { file: `${prefix}-business-name.png`, label: `${prefix} business name badge`, html: `<h4 class="reveal-business-name">${escapeHtml(stop.businessName || 'To Be Revealed')}</h4>` },
                { file: `${prefix}-body.png`, label: `${prefix} body copy`, html: `<p class="reveal-body">${escapeHtml(body)}</p>` },
                { file: `${prefix}-footer.png`, label: `${prefix} footer`, html: `<div class="reveal-card-footer"><div class="reveal-business-address">${escapeHtml(address)}</div>${host.link ? `<span class="stop-host-link">${escapeHtml(host.linkLabel)}</span>` : ''}${stop.website ? `<span class="stop-host-link">${escapeHtml(websiteText)}</span>` : ''}</div>` }
            ];
        }

        function buildWinnerLayers(districtCopy, vars) {
            const winner = districtCopy.winner || {};
            const meetupHighlight = `Meet us there ${districtCopy.date} at ${winner.meetupTime || '8:30pm'}!`;
            const voteCount = winner.voteCount ?? '—';
            const summaryLead = winner.summaryBody || winner.body || (
                `With ${voteCount} votes, ${winner.businessName || 'TBA'} has been elected to host the last stop of District ${districtCopy.district} After Dark!`
            );

            return [
                { file: 'winner-frame.png', label: 'Winner glowing frame', html: `<div class="proc-card winner-frame"></div>` },
                { file: 'winner-crown-avatar.png', label: 'Winner crown avatar', html: `<div class="stop-avatar winner-card-crown">👑</div>` },
                { file: 'winner-stop-label-3d.png', label: 'Winner 3D stop label', html: `<div class="stop-label-3d">FINAL STOP</div>` },
                { file: 'winner-header-title.png', label: 'Winner header title', html: `<h3 class="stop-title">The People's Choice</h3>` },
                { file: 'winner-business-photo.png', label: 'Winner business photo', html: winner.image ? `<img src="${winner.image}" class="reveal-card-media winner-photo" alt="">` : `<div class="reveal-card-media winner-photo" style="background:rgba(255,255,255,0.08);"></div>` },
                { file: 'winner-business-name.png', label: 'Winner business name badge', html: `<h4 class="reveal-business-name">${escapeHtml(winner.businessName || 'TBA')}</h4>` },
                { file: 'winner-summary-body.png', label: 'Winner summary body', html: `<p class="winner-summary">${escapeHtml(summaryLead)}</p>` },
                { file: 'winner-meetup-highlight.png', label: 'Winner meetup highlight', html: `<span class="hero-meetup-highlight">${escapeHtml(meetupHighlight)}</span>` },
                { file: 'winner-host-council.png', label: 'Winner host — council', html: `<div class="winner-card-host"><img src="${districtCopy.councilImg}" class="stop-avatar" alt=""><div><span class="winner-card-host-role">Councilmember</span><span class="winner-card-host-name">${escapeHtml(districtCopy.councilName)}</span></div></div>` },
                { file: 'winner-host-influencer.png', label: 'Winner host — influencer', html: `<div class="winner-card-host"><img src="${districtCopy.influencerImg}" class="stop-avatar" alt=""><div><span class="winner-card-host-role">${escapeHtml(vars.influencerRole)}</span><span class="winner-card-host-name">${escapeHtml(districtCopy.influencerName)}</span></div></div>` }
            ];
        }

        function buildLayers(districtCopy) {
            const vars = buildVars(districtCopy);
            const stops = districtCopy.itinerary?.stops || [];
            const getHost = (role) => role === 'council'
                ? { img: districtCopy.councilImg, link: districtCopy.councilBioUrl, linkLabel: `View ${districtCopy.councilName}'s bio` }
                : { img: districtCopy.influencerImg, link: districtCopy.influencerSocialUrl, linkLabel: `Follow ${socialHandleFromUrl(districtCopy.influencerSocialUrl)}` };

            return [
                ...buildRunoffLayers('runoff-01', stops[0], vars, getHost(getStopHostRole(stops[0], 0))),
                ...buildRunoffLayers('runoff-02', stops[1], vars, getHost(getStopHostRole(stops[1], 1))),
                ...buildWinnerLayers(districtCopy, vars)
            ];
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function renderLayerBlob(element) {
            const canvas = await html2canvas(element, {
                backgroundColor: null,
                scale: 2,
                useCORS: true,
                logging: false
            });
            return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
        }

        async function exportLayer(element, filename) {
            const blob = await renderLayerBlob(element);
            downloadBlob(blob, filename);
            return blob;
        }

        async function buildAllLayerBlobs(onProgress) {
            const results = [];
            for (let i = 0; i < currentLayers.length; i++) {
                onProgress?.(i + 1, currentLayers[i].file);
                const element = document.getElementById(`layer-${i}`);
                const blob = await renderLayerBlob(element);
                results.push({ file: currentLayers[i].file, blob });
            }
            return results;
        }

        async function buildZipBlob(layers) {
            const zip = new JSZip();
            layers.forEach(({ file, blob }) => zip.file(file, blob));
            return zip.generateAsync({ type: 'blob' });
        }

        async function saveLayersToFolder(layers) {
            if (!window.showDirectoryPicker) {
                throw new Error('Your browser does not support saving directly to a folder. Use “Download All as ZIP” instead.');
            }

            const dirHandle = await window.showDirectoryPicker({
                mode: 'readwrite',
                startIn: 'downloads'
            });

            for (const { file, blob } of layers) {
                const fileHandle = await dirHandle.getFileHandle(file, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
            }
        }

        function renderLayers(layers) {
            const grid = document.getElementById('layer-grid');
            grid.innerHTML = layers.map((layer, index) => `
                <article class="layer-card">
                    <h2>${layer.label}</h2>
                    <div class="preview">
                        <div class="export-root" id="layer-${index}">${layer.html}</div>
                    </div>
                    <div class="layer-actions">
                        <button type="button" data-index="${index}" data-file="${layer.file}">Download PNG</button>
                    </div>
                </article>
            `).join('');

            grid.querySelectorAll('.layer-actions button').forEach((btn) => {
                btn.addEventListener('click', async () => {
                    const index = btn.dataset.index;
                    const element = document.getElementById(`layer-${index}`);
                    btn.disabled = true;
                    await exportLayer(element, btn.dataset.file);
                    btn.disabled = false;
                });
            });
        }

        let currentLayers = [];

        async function loadDistrict(districtId) {
            const status = document.getElementById('status');
            status.textContent = `Loading District ${districtId.toUpperCase()}…`;
            const response = await fetch(`data/event-pages/district-${districtId}.json`);
            if (!response.ok) throw new Error(`Could not load district-${districtId}.json`);
            const districtCopy = await response.json();
            currentLayers = buildLayers(districtCopy);
            renderLayers(currentLayers);
            status.textContent = `${currentLayers.length} layers ready. Browser exports go to your Downloads folder — use “Save to Folder…” to pick assets/congrats-post/district-${districtId}/ directly.`;
        }

        document.getElementById('export-all-btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const btn = document.getElementById('export-all-btn');
            btn.disabled = true;
            try {
                const layers = await buildAllLayerBlobs((i, file) => {
                    status.textContent = `Rendering ${i} / ${currentLayers.length}: ${file}`;
                });
                status.textContent = 'Building ZIP…';
                const zipBlob = await buildZipBlob(layers);
                const districtId = districtSelect.value;
                downloadBlob(zipBlob, `district-${districtId}-reveal-layers.zip`);
                status.textContent = `Saved district-${districtId}-reveal-layers.zip to your Downloads folder. Unzip into assets/congrats-post/district-${districtId}/ in the project.`;
            } catch (err) {
                status.textContent = `Export failed: ${err.message}`;
            }
            btn.disabled = false;
        });

        document.getElementById('save-folder-btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const btn = document.getElementById('save-folder-btn');
            btn.disabled = true;
            try {
                const layers = await buildAllLayerBlobs((i, file) => {
                    status.textContent = `Rendering ${i} / ${currentLayers.length}: ${file}`;
                });
                status.textContent = 'Choose the folder to save into (e.g. assets/congrats-post/district-c/)…';
                await saveLayersToFolder(layers);
                status.textContent = `Saved ${layers.length} PNG files to the folder you selected.`;
            } catch (err) {
                if (err.name !== 'AbortError') {
                    status.textContent = `Save failed: ${err.message}`;
                } else {
                    status.textContent = 'Folder save cancelled.';
                }
            }
            btn.disabled = false;
        });

        districtSelect.addEventListener('change', () => {
            loadDistrict(districtSelect.value).catch((err) => {
                document.getElementById('status').textContent = err.message;
            });
        });

        loadDistrict(districtSelect.value).catch((err) => {
            document.getElementById('status').textContent = err.message;
        });
    </script>
</body>
</html>
