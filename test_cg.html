<!DOCTYPE html>
<html>
<body>
    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collectionGroup, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        
        async function test() {
            try {
                console.log("Fetching customers via collectionGroup...");
                const snap = await getDocs(collectionGroup(db, "customers"));
                console.log("Snap size:", snap.size);
                if (snap.size > 0) {
                    const first = snap.docs[0];
                    console.log("Parent venue ID:", first.ref.parent.parent.id);
                }
            } catch(e) {
                console.error("Error:", e);
            }
        }
        test();
    </script>
</body>
</html>
