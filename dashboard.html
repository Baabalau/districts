<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Districts After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1626; 
            --bg-secondary: #1a233a;
            --text-primary: #CBA052; 
            --text-secondary: #DEBA84; 
            --accent: #8A2F25;
            --font-main: 'EB Garamond', Georgia, serif;
            --font-header: 'Oswald', sans-serif;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(203, 160, 82, 0.2);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: var(--font-header);
            margin: 0;
            text-transform: uppercase;
            font-size: 2rem;
        }
        .btn {
            padding: 8px 16px;
            background: var(--text-primary);
            color: var(--bg-primary);
            text-decoration: none;
            font-family: var(--font-main);
            font-weight: bold;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        select, input {
            padding: 8px;
            background: var(--bg-secondary);
            border: 1px solid rgba(203, 160, 82, 0.3);
            color: var(--text-primary);
            border-radius: 4px;
            font-family: var(--font-main);
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid rgba(203, 160, 82, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(203, 160, 82, 0.1);
        }
        th {
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th:hover {
            background: rgba(255,255,255,0.05);
        }
        tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(203, 160, 82, 0.3);
        }
        .thumbnail-placeholder {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            border: 1px dashed rgba(203, 160, 82, 0.2);
        }
        .sort-icon {
            font-size: 0.8em;
            margin-left: 5px;
            opacity: 0.5;
        }
        /* Modal for full size image */
        #image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #modal-img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
            border: 2px solid var(--text-primary);
        }
        #close-modal {
            margin-top: 20px;
        }
        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <h1>Check-In Dashboard</h1>
        <div>
            <a href="index.html" class="btn" style="background: transparent; border: 1px solid var(--text-primary); margin-right: 10px;">Back to Map</a>
            <button id="logout-btn" class="btn" style="background: var(--accent);">Logout</button>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="search-input" placeholder="Search user or business..." style="width: 250px;">
        <button id="refresh-btn" class="btn">Refresh Data</button>
        <span id="record-count" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
    </div>

    <div id="loading">Loading check-in data...</div>

    <div class="table-container" style="display: none;" id="table-wrapper">
        <table id="data-table">
            <thead>
                <tr>
                    <th data-sort="time">Last Visit <span class="sort-icon">▼</span></th>
                    <th data-sort="business">Business <span class="sort-icon"></span></th>
                    <th data-sort="user">User <span class="sort-icon"></span></th>
                    <th data-sort="visits">Total Visits <span class="sort-icon"></span></th>
                    <th>Photo</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows will be injected here via JS -->
            </tbody>
        </table>
    </div>

    <!-- Image Modal -->
    <div id="image-modal">
        <img id="modal-img" src="" alt="Full check-in photo">
        <button id="close-modal" class="btn">Close</button>
    </div>

    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const loadingEl = document.getElementById("loading");
        const tableWrapper = document.getElementById("table-wrapper");
        const tbody = document.getElementById("table-body");
        const searchInput = document.getElementById("search-input");
        const refreshBtn = document.getElementById("refresh-btn");
        const recordCount = document.getElementById("record-count");
        const logoutBtn = document.getElementById("logout-btn");
        
        // Modal elements
        const imageModal = document.getElementById("image-modal");
        const modalImg = document.getElementById("modal-img");
        const closeModal = document.getElementById("close-modal");

        let allData = [];
        let currentSort = { column: 'time', direction: 'desc' };

        // Authentication check & Authorization
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            } 
            
            // Check if user is the admin
            if (user.email !== "robhenigbell@gmail.com") {
                loadingEl.innerHTML = `<span style="color:#ff6b6b">Access Denied: You do not have permission to view this page.</span>`;
                return;
            }
            
            fetchData();
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });

        async function fetchData() {
            loadingEl.style.display = "block";
            tableWrapper.style.display = "none";
            allData = [];

            try {
                // 1. Fetch all venues to get their IDs and Names
                const venuesSnapshot = await getDocs(collection(db, "venues"));
                
                // 2. Loop through each venue and fetch its "customers" subcollection
                const fetchPromises = venuesSnapshot.docs.map(async (venueDoc) => {
                    const venueId = venueDoc.id;
                    const venueName = venueDoc.data().name || "Unknown Business";
                    
                    const customersSnapshot = await getDocs(collection(db, "venues", venueId, "customers"));
                    
                    customersSnapshot.forEach((custDoc) => {
                        const custData = custDoc.data();
                        
                        // Parse timestamp
                        let timeObj = new Date(0);
                        if (custData.lastVisit && custData.lastVisit.toDate) {
                            timeObj = custData.lastVisit.toDate();
                        }
                        
                        allData.push({
                            id: `${venueId}_${custDoc.id}`,
                            business: venueName,
                            user: custData.displayName || custData.email || "Unknown User",
                            email: custData.email || "",
                            time: timeObj,
                            timeFormatted: timeObj.toLocaleString(),
                            visits: custData.visitCount || 1,
                            photoUrl: custData.photoUrl || null,
                            photoStatus: custData.photoStatus || "none"
                        });
                    });
                });

                await Promise.all(fetchPromises);
                
                // Initial sort (newest first)
                sortData();
                renderTable();

            } catch (error) {
                console.error("Error fetching data:", error);
                loadingEl.innerHTML = `<span style="color:#ff6b6b">Error loading data: ${error.message}</span>`;
            }
        }

        function sortData() {
            allData.sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            
            const filteredData = allData.filter(row => {
                return row.business.toLowerCase().includes(searchTerm) || 
                       row.user.toLowerCase().includes(searchTerm) ||
                       row.email.toLowerCase().includes(searchTerm);
            });

            recordCount.textContent = `${filteredData.length} records found`;

            tbody.innerHTML = filteredData.map(row => {
                let photoHTML = '';
                if (row.photoUrl && row.photoUrl !== "pending_upload" && row.photoUrl !== "Pending Upload") {
                    photoHTML = `<img src="${row.photoUrl}" class="thumbnail" data-full="${row.photoUrl}" alt="Check-in">`;
                } else if (row.photoStatus === "pending" || row.photoUrl === "pending_upload") {
                    photoHTML = `<div class="thumbnail-placeholder">Pending</div>`;
                } else {
                    photoHTML = `<div class="thumbnail-placeholder">No Photo</div>`;
                }

                return `
                    <tr>
                        <td style="font-size: 0.9rem; color: var(--text-secondary);">${row.timeFormatted}</td>
                        <td style="font-weight: bold;">${row.business}</td>
                        <td>
                            ${row.user}
                            <div style="font-size: 0.8rem; color: var(--text-secondary);">${row.email}</div>
                        </td>
                        <td style="text-align: center;">${row.visits}</td>
                        <td>${photoHTML}</td>
                    </tr>
                `;
            }).join('');

            loadingEl.style.display = "none";
            tableWrapper.style.display = "block";

            // Attach image click listeners
            document.querySelectorAll('.thumbnail').forEach(img => {
                img.addEventListener('click', (e) => {
                    modalImg.src = e.target.getAttribute('data-full');
                    imageModal.style.display = 'flex';
                });
            });
        }

        // Sorting Listeners
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.getAttribute('data-sort');
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = column === 'time' ? 'desc' : 'asc';
                }

                // Update arrows
                document.querySelectorAll('.sort-icon').forEach(icon => icon.textContent = '');
                th.querySelector('.sort-icon').textContent = currentSort.direction === 'asc' ? '▲' : '▼';

                sortData();
                renderTable();
            });
        });

        // Search and Refresh
        searchInput.addEventListener('input', renderTable);
        refreshBtn.addEventListener('click', fetchData);

        // Modal close
        closeModal.addEventListener('click', () => { imageModal.style.display = 'none'; });
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) imageModal.style.display = 'none';
        });

    </script>
</body>
</html>
