<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Flyer Generator | Districts After Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Inter:wght@400;600;800&family=Montserrat:wght@700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/district-page.css">
    <link rel="stylesheet" href="css/event-styles.css">
    
    <!-- html2canvas for flattening composite images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- JSZip for batch downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f1626;
            --brand-red: #8a2d24;
            --brand-gold: #eecd7e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--brand-gold);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .controls {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .district-select {
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid var(--brand-gold);
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--brand-red);
            color: white;
        }

        .btn-primary:hover {
            background: #6b2420;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--brand-gold);
            color: var(--bg-dark);
        }

        .btn-secondary:hover {
            background: #d4b85e;
        }

        .status {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-weight: 500;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--brand-gold);
            width: 0%;
            transition: width 0.3s;
        }

        .batch-venue-explorer {
            margin-top: 20px;
        }

        .batch-venue-explorer .venue-list .venue-card {
            gap: 12px;
        }

        .batch-venue-explorer .venue-list .venue-card.selected {
            border-color: var(--brand-gold);
        }

        .batch-venue-explorer .venue-list .venue-card.completed {
            border-color: #4ade80;
        }

        .batch-venue-explorer .venue-list .venue-card.error {
            border-color: #ef4444;
        }

        .batch-venue-explorer .venue-select {
            width: 20px;
            height: 20px;
            accent-color: var(--brand-gold);
            flex-shrink: 0;
            cursor: pointer;
        }

        .batch-venue-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            min-width: 120px;
        }

        .venue-status {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .venue-status.pending {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }

        .venue-status.generating {
            background: rgba(238, 205, 126, 0.2);
            color: var(--brand-gold);
        }

        .venue-status.done {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .venue-status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .download-link {
            color: var(--brand-gold);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        /* Hidden flyer generator area */
        #flyer-generator {
            position: absolute;
            left: -9999px;
            top: 0;
        }

        .flyer-composite {
            position: relative;
            width: 450px;
            aspect-ratio: 8.5 / 11;
            background: white;
            overflow: hidden;
        }

        .flyer-composite img.base-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flyer-composite .overlay {
            position: absolute;
        }

        #flyer-name-text {
            font-family: var(--font-header);
            font-weight: bold;
        }

        .select-all-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .select-all-row label {
            cursor: pointer;
            font-weight: 500;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--brand-gold);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            display: block;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            transform: none;
        }

        .empty-state:hover {
            transform: none;
            border-color: transparent;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Batch Flyer Generator</h1>
        <p class="subtitle">Generate printable flyers for multiple businesses at once.</p>

        <div class="controls">
            <select id="district-select" class="district-select">
                <option value="">Select District...</option>
                <option value="A">District A</option>
                <option value="B">District B</option>
                <option value="C">District C</option>
                <option value="D">District D</option>
                <option value="E" selected>District E</option>
            </select>
            
            <button id="load-venues-btn" class="btn btn-secondary">Load Venues</button>
            <button id="generate-all-btn" class="btn btn-primary" disabled>Generate Selected Flyers</button>
            <button id="download-zip-btn" class="btn btn-secondary" disabled>Download All as ZIP</button>
            
            <div id="status" class="status" style="display: none;"></div>
        </div>

        <div class="progress-bar" id="progress-bar">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <div class="venue-explorer batch-venue-explorer">
            <div class="select-all-row" id="select-all-row" style="display: none;">
                <input type="checkbox" id="select-all" checked>
                <label for="select-all">Select All (<span id="venue-count">0</span> venues)</label>
            </div>

            <div class="venue-list-container">
                <ul id="venue-list" class="venue-list">
                    <li class="empty-state">
                        <h3>No venues loaded</h3>
                        <p>Select a district and click "Load Venues" to get started.</p>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Hidden flyer generator -->
    <div id="flyer-generator">
        <div id="flyer-composite" class="flyer-composite">
            <img id="flyer-base-img" class="base-img" src="" crossorigin="anonymous">
            <img id="flyer-logo-overlay" class="overlay" src="" style="display: none;">
            <div id="flyer-name-text" class="overlay"></div>
            <img id="flyer-qr-overlay" class="overlay" src="" crossorigin="anonymous">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDf-vGCbNNKa6xayqCJXSJc_JDWR8atJ_4",
            authDomain: "districts-after-dark.firebaseapp.com",
            projectId: "districts-after-dark",
            storageBucket: "districts-after-dark.firebasestorage.app",
            messagingSenderId: "111193459737",
            appId: "1:111193459737:web:8531d3c7405e374af96e88"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Graphic configuration (same as promote.html)
        const graphicConfig = {
            flyer: {
                qr: { bottom: '27%', left: '78%', width: '18%', transform: 'translate(-50%, 50%)' },
                text: { top: '72%', left: '30%', width: '35%', fontSize: '1.1rem', color: '#8a2d24', transform: 'translate(-50%, -50%)', textAlign: 'center', whiteSpace: 'normal', wordWrap: 'break-word', lineHeight: '1.2', display: 'flex', alignItems: 'center', justifyContent: 'center', height: '12%' }
            },
            qrColors: {
                foreground: 'eecd7e',
                background: '1F2937'
            }
        };

        // State
        let venues = [];
        let generatedFlyers = new Map(); // venueId -> dataUrl

        // DOM elements
        const districtSelect = document.getElementById('district-select');
        const loadBtn = document.getElementById('load-venues-btn');
        const generateBtn = document.getElementById('generate-all-btn');
        const downloadZipBtn = document.getElementById('download-zip-btn');
        const venueList = document.getElementById('venue-list');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const selectAllRow = document.getElementById('select-all-row');
        const selectAllCheckbox = document.getElementById('select-all');
        const venueCountSpan = document.getElementById('venue-count');

        // Flyer elements
        const flyerComposite = document.getElementById('flyer-composite');
        const flyerBaseImg = document.getElementById('flyer-base-img');
        const flyerNameText = document.getElementById('flyer-name-text');
        const flyerQrOverlay = document.getElementById('flyer-qr-overlay');

        function showStatus(message, showSpinner = false) {
            statusEl.innerHTML = showSpinner ? `<span class="loading-spinner"></span>${message}` : message;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            statusEl.style.display = 'none';
        }

        function updateProgress(current, total) {
            const percent = (current / total) * 100;
            progressFill.style.width = `${percent}%`;
        }

        function slugifyBusinessName(name) {
            return name
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '') || 'business';
        }

        function buildFlyerFilename(venue, usedNames = new Set()) {
            let base = `${slugifyBusinessName(venue.name)}-flyer`;
            let filename = `${base}.png`;
            let counter = 2;

            while (usedNames.has(filename)) {
                filename = `${base}-${counter}.png`;
                counter++;
            }

            usedNames.add(filename);
            return filename;
        }

        // Load venues from Firebase
        loadBtn.addEventListener('click', async () => {
            const district = districtSelect.value;
            if (!district) {
                alert('Please select a district first.');
                return;
            }

            showStatus('Loading venues...', true);
            loadBtn.disabled = true;

            try {
                const venuesRef = collection(db, 'venues');
                const q = query(venuesRef, where('district', '==', district));
                const snapshot = await getDocs(q);

                venues = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.name) {
                        venues.push({
                            id: doc.id,
                            name: data.name,
                            address: data.address || '',
                            district: data.district
                        });
                    }
                });

                // Sort alphabetically
                venues.sort((a, b) => a.name.localeCompare(b.name));

                renderVenueList();
                venueCountSpan.textContent = venues.length;
                selectAllRow.style.display = 'flex';
                generateBtn.disabled = venues.length === 0;
                
                showStatus(`Loaded ${venues.length} venues from District ${district}`);
                setTimeout(hideStatus, 3000);

            } catch (error) {
                console.error('Error loading venues:', error);
                showStatus('Error loading venues. Check console for details.');
            }

            loadBtn.disabled = false;
        });

        function renderVenueList() {
            if (venues.length === 0) {
                venueList.innerHTML = `
                    <li class="empty-state">
                        <h3>No venues found</h3>
                        <p>No venues found for this district.</p>
                    </li>
                `;
                return;
            }

            venueList.innerHTML = venues.map((venue, index) => `
                <li class="venue-card" data-venue-id="${venue.id}" id="venue-card-${index}">
                    <input type="checkbox" class="venue-select" id="venue-${index}" data-index="${index}" checked>
                    <div class="v-details">
                        <strong class="venue-name">${venue.name}</strong>
                        ${venue.address ? `<span class="venue-subtitle">${venue.address}</span>` : ''}
                    </div>
                    <div class="batch-venue-actions">
                        <span class="venue-status pending">Pending</span>
                    </div>
                </li>
            `).join('');

            venueList.querySelectorAll('.venue-select').forEach(cb => {
                cb.addEventListener('change', updateSelectAllState);
            });
        }

        function updateSelectAllState() {
            const checkboxes = venueList.querySelectorAll('.venue-select');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            selectAllCheckbox.checked = allChecked;
        }

        selectAllCheckbox.addEventListener('change', () => {
            venueList.querySelectorAll('.venue-select').forEach(cb => {
                cb.checked = selectAllCheckbox.checked;
            });
        });

        // Generate flyers
        generateBtn.addEventListener('click', async () => {
            const selectedIndices = [];
            venueList.querySelectorAll('.venue-select:checked').forEach(cb => {
                selectedIndices.push(parseInt(cb.dataset.index));
            });

            if (selectedIndices.length === 0) {
                alert('Please select at least one venue.');
                return;
            }

            generateBtn.disabled = true;
            loadBtn.disabled = true;
            progressBar.style.display = 'block';
            generatedFlyers.clear();
            const usedFilenames = new Set();

            const districtLetter = districtSelect.value;
            const basePath = window.location.pathname.replace(/[^/]*$/, '');

            // Apply text styles
            Object.assign(flyerNameText.style, graphicConfig.flyer.text);
            Object.assign(flyerQrOverlay.style, graphicConfig.flyer.qr);

            for (let i = 0; i < selectedIndices.length; i++) {
                const index = selectedIndices[i];
                const venue = venues[index];
                const card = document.getElementById(`venue-card-${index}`);
                const statusSpan = card.querySelector('.venue-status');

                statusSpan.className = 'venue-status generating';
                statusSpan.textContent = 'Generating...';
                card.classList.add('selected');

                showStatus(`Generating flyer ${i + 1} of ${selectedIndices.length}: ${venue.name}`, true);
                updateProgress(i, selectedIndices.length);

                try {
                    // Build vote URL
                    const venueId = venue.id || venue.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                    const districtPage = `district-${districtLetter.toLowerCase()}.html`;
                    const votingUrl = `${window.location.origin}${basePath}${districtPage}?vote=${venueId}`;
                    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(votingUrl)}&color=${graphicConfig.qrColors.foreground}&bgcolor=${graphicConfig.qrColors.background}`;

                    // Set up flyer
                    flyerBaseImg.src = `assets/Districts_Standup_Flyer/Districts_Standup_${districtLetter}.png`;
                    flyerNameText.textContent = venue.name;
                    flyerNameText.style.display = 'flex';
                    flyerQrOverlay.src = qrApiUrl;

                    // Wait for images to load
                    await Promise.all([
                        new Promise((resolve, reject) => {
                            if (flyerBaseImg.complete) resolve();
                            else {
                                flyerBaseImg.onload = resolve;
                                flyerBaseImg.onerror = reject;
                            }
                        }),
                        new Promise((resolve, reject) => {
                            flyerQrOverlay.onload = resolve;
                            flyerQrOverlay.onerror = reject;
                        })
                    ]);

                    // Small delay for rendering
                    await new Promise(r => setTimeout(r, 200));

                    if (document.fonts && document.fonts.ready) {
                        try {
                            await Promise.race([
                                document.fonts.ready,
                                new Promise((_, reject) => setTimeout(() => reject(new Error('Font loading timed out')), 4000))
                            ]);
                        } catch (e) { /* proceed anyway */ }
                    }

                    // Flatten with html2canvas
                    const canvas = await html2canvas(flyerComposite, {
                        useCORS: true,
                        scale: 2,
                        backgroundColor: null,
                        imageTimeout: 10000,
                        logging: false
                    });

                    const dataUrl = canvas.toDataURL('image/png');
                    const filename = buildFlyerFilename(venue, usedFilenames);
                    generatedFlyers.set(filename, dataUrl);

                    // Update card with success
                    statusSpan.className = 'venue-status done';
                    statusSpan.textContent = 'Generated';
                    card.classList.remove('selected');
                    card.classList.add('completed');

                    const actionsEl = card.querySelector('.batch-venue-actions');
                    let downloadLink = actionsEl.querySelector('.download-link');
                    if (!downloadLink) {
                        downloadLink = document.createElement('a');
                        downloadLink.className = 'download-link';
                        actionsEl.appendChild(downloadLink);
                    }
                    downloadLink.href = dataUrl;
                    downloadLink.download = filename;
                    downloadLink.textContent = 'Download Flyer';

                } catch (error) {
                    console.error(`Error generating flyer for ${venue.name}:`, error);
                    statusSpan.className = 'venue-status error';
                    statusSpan.textContent = 'Error';
                    card.classList.remove('selected');
                    card.classList.add('error');
                }
            }

            updateProgress(selectedIndices.length, selectedIndices.length);
            showStatus(`Generated ${generatedFlyers.size} flyers successfully!`);
            
            generateBtn.disabled = false;
            loadBtn.disabled = false;
            downloadZipBtn.disabled = generatedFlyers.size === 0;

            setTimeout(() => {
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
            }, 2000);
        });

        // Download all as ZIP
        downloadZipBtn.addEventListener('click', async () => {
            if (generatedFlyers.size === 0) {
                alert('No flyers to download. Generate some first!');
                return;
            }

            showStatus('Creating ZIP file...', true);
            downloadZipBtn.disabled = true;

            try {
                const zip = new JSZip();
                const district = districtSelect.value;
                const folder = zip.folder(`District_${district}_Flyers`);

                generatedFlyers.forEach((dataUrl, filename) => {
                    // Convert data URL to base64
                    const base64 = dataUrl.split(',')[1];
                    folder.file(filename, base64, { base64: true });
                });

                const content = await zip.generateAsync({ type: 'blob' });
                
                // Create download link
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `District_${district}_Flyers.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showStatus(`Downloaded ZIP with ${generatedFlyers.size} flyers!`);
                setTimeout(hideStatus, 3000);

            } catch (error) {
                console.error('Error creating ZIP:', error);
                showStatus('Error creating ZIP file.');
            }

            downloadZipBtn.disabled = false;
        });

        // Auto-load District E on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => loadBtn.click(), 500);
        });
    </script>
</body>
</html>
